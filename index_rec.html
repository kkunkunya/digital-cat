<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff3e3">
<title>拍一下猫屁屁 · 30 秒放松一下</title>
<meta name="description" content="拍一下猫屁屁，30 秒放松一下。Pat the cat and unwind in 30 seconds.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
<style>
:root{--bg1:#fff3e3;--bg2:#ffc890;--ink:#7a3f10}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(var(--bg1),var(--bg2));font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;color:var(--ink);transition:color .4s}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{position:absolute;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 16px 0;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
#top>*{pointer-events:auto}
#mute{display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:10px 14px;font:700 15px/1 inherit;color:var(--ink);background:#fffc;box-shadow:0 4px 14px #0001,inset 0 -2px 0 #0000000d}
#mute svg{width:20px;height:20px}
#mute.off{background:var(--ink);color:#fff}
#mute.nudge{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{box-shadow:0 4px 14px #0002,0 0 0 0 var(--ink)}50%{box-shadow:0 4px 14px #0002,0 0 0 6px #0000}}
#snd{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
#ear{font-size:12px;font-weight:700;opacity:.75;padding-left:6px;transition:opacity .5s}
#ear.gone{opacity:0}
#lang{display:flex;padding:3px;border-radius:999px;background:#fff9;box-shadow:inset 0 -2px 0 #0000000d}
#lang button{border:0;border-radius:999px;padding:7px 12px;font:700 13px/1 inherit;color:var(--ink);background:none;opacity:.6}
#lang button.on{background:var(--ink);color:#fff;opacity:1}
#cred{position:absolute;right:8px;bottom:8px;max-width:40px;font-size:9px;line-height:1.2;text-align:center;color:inherit;opacity:.35;text-decoration:none}
#done{position:absolute;left:50%;bottom:44px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;white-space:nowrap;box-shadow:0 8px 24px #0003}
#done.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.btn.glow{animation:glow 1.2s ease-in-out 4}
@keyframes glow{50%{transform:scale(1.07);box-shadow:0 0 0 6px #fff8}}
#mute .x{display:none}#mute.off .x{display:block}#mute.off .w{display:none}
#score{text-align:right;pointer-events:none}
#num{display:inline-block;font-size:52px;font-weight:900;line-height:1;letter-spacing:-1px;text-shadow:0 3px 0 #fff8}
#num.bump{animation:bump .28s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1.35)}100%{transform:scale(1)}}
#score small{font-size:16px;font-weight:700;margin-left:2px}
#score small[data-t=pre]{margin:0 4px 0 0}
#combo{margin-top:4px;font-size:15px;font-weight:800;color:#fff;background:#ff6a3d;border-radius:999px;padding:4px 10px;display:inline-block;opacity:0;transform:scale(.6);transition:opacity .25s,transform .25s}
#combo.on{opacity:1;transform:scale(1)}
#combo.bump{animation:bump .25s ease-out}
#line{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:15px;font-weight:600;opacity:.85;pointer-events:none;padding:0 46px}
#line.flash{animation:fade .5s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:.85}}
#hint{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);pointer-events:none;font-size:15px;font-weight:800;background:#fff;color:var(--ink);padding:9px 14px;border-radius:18px;box-shadow:0 6px 20px #0002;animation:hint 1.1s ease-in-out infinite;transition:opacity .3s}
#hint small{display:block;font-size:11px;font-weight:700;opacity:.65;margin-top:3px;text-align:center}
#hint.gone{opacity:0;animation:none}
@keyframes hint{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-62%)}}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:30px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;white-space:nowrap;animation:pop 1s cubic-bezier(.2,.9,.3,1) forwards}
.pop.big{font-size:40px;color:#ffe14d}
.pop.soft{font-size:24px;color:#ffd1dc}
.pop.heart{font-size:30px;-webkit-text-stroke:0;color:#ff4f7b;animation-duration:1.1s}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3) rotate(0)}18%{transform:translate(-50%,-70%) scale(1.25) rotate(var(--rot))}100%{transform:translate(calc(-50% + var(--dx)),-260%) scale(1) rotate(var(--rot));opacity:0}}
.ring{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:4px solid #fff;animation:ring .5s ease-out forwards}
@keyframes ring{to{transform:scale(5);opacity:0;border-width:1px}}
#bar{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px 14px max(14px,env(safe-area-inset-bottom))}
.chip,.btn{border:0;border-radius:999px;font:800 15px/1 inherit;padding:13px 16px;color:var(--ink);background:#fff9;box-shadow:inset 0 -2px 0 #0000000d}
.chip small{display:block;font-size:11px;font-weight:600;opacity:.7;margin-top:3px}
.chip.on{background:#fff;box-shadow:0 4px 14px #0002,0 0 0 2px var(--ink)}
.btn{background:var(--ink);color:#fff;padding:15px 18px}
.chip:active,.btn:active,#mute:active{transform:scale(.95)}
#card{position:fixed;inset:0;z-index:9;background:#000b;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#card.on{display:flex;animation:fade .25s}
#card img{max-height:calc(100% - 120px);max-width:100%;border-radius:16px;box-shadow:0 10px 40px #0006;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#card .tip{color:#fffc;font-size:14px;margin-top:-4px}
#card .row{display:flex;gap:10px}
#card .btn{background:#fff;color:#222;padding:15px 26px}
#card #closebtn{background:#fff3;color:#fff}
#dbg{position:fixed;left:4px;bottom:4px;font:11px monospace;background:#000a;color:#0f0;padding:4px;z-index:20}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="fx"></div>
    <div id="top">
      <div id="snd"><div id="lang" role="group" aria-label="Language"><button data-l="zh" lang="zh">中文</button><button data-l="en" lang="en">English</button></div><button id="mute" aria-label="声音"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="w" d="M16 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="x" d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>关闭声音</span></button><div id="ear" data-t="ear">建议佩戴耳机</div></div>
      <div id="score"><small data-t="pre">已拍</small><span id="num">0</span><small id="unit" data-t="unit">下</small><br><span id="combo"></span></div>
    </div>
    <div id="hint" data-t="hint">点击轻拍<small>左右拖动可转动视角</small></div>
    <div id="line"></div>
    <button id="done" class="btn" data-t="done">放松完成，分享战绩</button>
    <a id="cred" href="audio/CREDITS.txt" target="_blank" rel="noopener" data-t="cred">音效来源</a>
  </div>
  <div id="bar">
    <button class="chip on">橘子<small>温顺</small></button>
    <button class="chip">煤球<small>傲娇</small></button>
    <button class="btn" id="sharebtn" data-t="share">分享战绩</button>
  </div>
</div>
<div id="card"><img id="cardimg" alt="分享图"><div class="tip" data-t="tip">长按图片即可保存或发送给朋友。</div><div class="row"><button class="btn" id="savebtn" data-t="save">保存图片</button><button class="btn" id="closebtn" data-t="close">关闭</button></div></div>
<pre id="dbg" hidden></pre>
<script type="module" src="dist/app.js?v=795c1a46"></script>
<script>
// test-only: after the first real touch, records the page's own audio and replays a patting session as pointer events; uploads audio at the end
(function(){var started=false;
function ev(t,x,y){var c=document.getElementById('gl');c.dispatchEvent(new PointerEvent(t,{pointerId:7,pointerType:'touch',isPrimary:true,clientX:x,clientY:y,bubbles:true,cancelable:true}))}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function tap(x,y){ev('pointerdown',x,y);await sleep(40);ev('pointerup',x,y)}
async function drag(){var h=innerHeight;ev('pointerdown',innerWidth*0.15,h*0.3);for(var i=1;i<=12;i++){await sleep(16);ev('pointermove',innerWidth*(0.15+0.7*i/12),h*0.3)}ev('pointerup',innerWidth*0.85,h*0.3)}
async function run(){var W=innerWidth,H=innerHeight;
 for(var i=0;i<100;i++){await tap(W*0.5+((i*7)%40)-20,H*0.5+((i*13)%30)-15);await sleep(i<20?150:90)}
 await sleep(1200);
 for(var k=0;k<3;k++){await drag();for(var i=0;i<12;i++){await tap(W*0.5,H*0.5);await sleep(130)}}}
function go(){if(started||!window.__cat)return;started=true;var d=window.__cat.audio.recordStream(),ch=[],mt=MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'audio/webm',r=new MediaRecorder(d,{mimeType:mt});r.ondataavailable=function(e){ch.push(e.data)};r.start();fetch('http://127.0.0.1:8732/start-'+Date.now()+'.txt',{method:'POST',body:'x'});run().then(function(){return sleep(800)}).then(function(){r.stop();setTimeout(function(){fetch('http://127.0.0.1:8732/sim-audio.'+(mt=='audio/mp4'?'m4a':'webm'),{method:'POST',body:new Blob(ch)})},600)})}
addEventListener('pointerup',function(e){if(e.pointerId!==7)setTimeout(go,300)},true)})();
</script></body>
</html>

</html>
